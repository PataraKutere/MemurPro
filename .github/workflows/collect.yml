name: MemurPro official-source collector

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memurpro-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Validate collector syntax
        run: python -m py_compile collector/scrape.py
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect official announcements
        env:
          MEMURPRO_API_BASE: https://memurpro-api.28berat28.workers.dev
          MEMURPRO_INGEST_TOKEN: ${{ secrets.MEMURPRO_INGEST_TOKEN }}
        run: |
          test -n "$MEMURPRO_INGEST_TOKEN" || (echo "MEMURPRO_INGEST_TOKEN secret is missing" && exit 1)
          python collector/scrape.py
