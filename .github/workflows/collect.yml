name: MemurPro official-source collector

on:
  push:
    paths:
      - 'collector/**'
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memurpro-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector syntax
        run: python -m py_compile collector/scrape.py
      - name: Check ingestion secret
        id: ingest-secret
        env:
          TOKEN: ${{ secrets.MEMURPRO_INGEST_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MEMURPRO_INGEST_TOKEN is missing; scheduled collection will be skipped."
          fi
      - name: Install dependencies and Chromium
        if: github.event_name == 'push' || steps.ingest-secret.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Smoke test public sources (no database writes)
        if: github.event_name == 'push'
        env:
          MEMURPRO_API_BASE: https://memurpro-api.28berat28.workers.dev
          COLLECTOR_DRY_RUN: '1'
        run: python collector/scrape.py
      - name: Collect official announcements
        if: github.event_name != 'push' && steps.ingest-secret.outputs.enabled == 'true'
        env:
          MEMURPRO_API_BASE: https://memurpro-api.28berat28.workers.dev
          MEMURPRO_INGEST_TOKEN: ${{ secrets.MEMURPRO_INGEST_TOKEN }}
        run: python collector/scrape.py
