name: MemurPro official-source collector

on:
  push:
    paths:
      - 'collector/**'
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Kaynak erişimi için çalışma ortamı"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: memurpro-source-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector syntax
        run: python -m py_compile collector/scrape.py
      - name: Check ingestion secret
        id: ingest-secret
        env:
          TOKEN: ${{ secrets.MEMURPRO_INGEST_TOKEN }}
        shell: pwsh
        run: |
          if ($env:TOKEN) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::MEMURPRO_INGEST_TOKEN is missing; scheduled collection will be skipped."
          }
      - name: Install Python dependencies
        if: steps.ingest-secret.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
      - name: Install Chromium (Linux)
        if: steps.ingest-secret.outputs.enabled == 'true' && runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium (Windows / macOS)
        if: steps.ingest-secret.outputs.enabled == 'true' && runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Collect official announcements
        if: steps.ingest-secret.outputs.enabled == 'true'
        env:
          MEMURPRO_API_BASE: https://memurpro-api.28berat28.workers.dev
          MEMURPRO_INGEST_TOKEN: ${{ secrets.MEMURPRO_INGEST_TOKEN }}
          COLLECTOR_FORCE: ${{ inputs.runner == 'self-hosted' && '1' || '0' }}
        run: python collector/scrape.py
